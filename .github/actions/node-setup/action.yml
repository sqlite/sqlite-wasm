inputs:
  node-version:
    description: 'Node.js version'
    required: false
    default: 'lts/*'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install dependencies
      shell: bash
      run: |
        set -euo pipefail
        npm ci --prefer-offline --no-audit --no-fund
